<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h2>Student Registration Form</h2>

<form>

<label for="name">Full Name</label>
<input type="text" id="name" name="name" placeholder="Enter your name">

<label for="id">Student ID</label>
<input type="text" id="id" name="id" placeholder="Enter your ID">

<label for="email">Email</label>
<input type="email" id="email" name="email" placeholder="Enter your email">

<label for="phone">Phone Number</label>
<input type="number" id="phone" name="phone" placeholder="Enter your phone number">

<label>Gender</label>

<div class="gender">
<input type="radio" id="male" name="gender">
<label for="male">Male</label>

<input type="radio" id="female" name="gender">
<label for="female">Female</label>

<input type="radio" id="other" name="gender">
<label for="other">Other</label>
</div>

<label for="dob">Date of Birth</label>
<input type="date" id="dob" name="dob">

<label>Programming Skills</label>

<div class="skills">

<input type="checkbox" id="html">
<label for="html">HTML</label>

<input type="checkbox" id="css">
<label for="css">CSS</label>

<input type="checkbox" id="javascript">
<label for="javascript">JavaScript</label>

<input type="checkbox" id="python">
<label for="python">Python</label>

</div>

<label for="info">Additional Information</label>
<textarea id="info" rows="5" placeholder="Write something about yourself"></textarea>

<label for="photo">Upload Photo</label>
<input type="file" id="photo">

<label for="address">Address</label>
<textarea id="address" rows="4" placeholder="Enter your address"></textarea>

<div class="button-group">

<input type="submit" value="Submit">

<input type="reset" value="Reset">

</div>

</form>

</div>

</body>
</html>
