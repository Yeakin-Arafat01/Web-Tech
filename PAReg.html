<!DOCTYPE html>
<html>
<head>
    <title>Patient Appointment Registration</title>
    <link rel="stylesheet" href="P_A_Reg.css">
</head>
<body>

<div class="container">
    <h2>HealthyLife Medical Center</h2>
    <h3>Patient Appointment Registration</h3>

    <form id="appointmentForm">

        <label>First Name</label>
        <input type="text" id="firstName">
        <span class="error" id="firstNameError"></span><br><br>

        <label>Last Name</label>
        <input type="text" id="lastName">
        <span class="error" id="lastNameError"></span><br><br>

        <label>Email</label>
        <input type="email" id="email">
        <span class="error" id="emailError"></span><br><br>

        <label>Password</label>
        <input type="password" id="password"><br><br>

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword">
        <span class="error" id="passwordError"></span><br><br>

        <label>Gender</label>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other
        <br>
        <span class="error" id="genderError"></span>

        <label>Preferred Service</label><br>
        <input type="checkbox" name="service" value="General Checkup"> General Checkup
        <input type="checkbox" name="service" value="Dental"> Dental
        <input type="checkbox" name="service" value="Eye Care"> Eye Care
        <br>
        <span class="error" id="serviceError"></span>

        <label>Doctor's Department</label>
        <select id="department">
            <option value="">Select Department</option>
            <option>Cardiology</option>
            <option>Neurology</option>
            <option>Orthopedics</option>
            <option>Pediatrics</option><br>
        </select>
        <span class="error" id="departmentError"></span><br><br>

        <label>Health Description</label>
        <textarea id="description"></textarea>
        <span class="error" id="descriptionError"></span>

        <br><br>
        <button type="submit">Register</button>

    </form>

    <h3 id="successMessage"></h3>

</div>

<script src="Pa_Ap_Reg.js"></script>

</body>
</html>
